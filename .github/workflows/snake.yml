name: Generate contribution snake

on:
  schedule:
    # Twice a day is plenty — the contribution graph only changes on commit.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # Required to create and push the `output` branch. If this job fails with
      # a 403, flip Settings -> Actions -> General -> Workflow permissions to
      # "Read and write permissions".
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Filenames here must match the ones README.md points at on the
          # `output` branch: snake.svg (light) and snake-dark.svg (dark).
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
